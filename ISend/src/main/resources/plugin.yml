name: ISend
version: '${version}'
main: dev.isend.ISendPlugin
api-version: '1.21'
description: Send items to other players through a GUI mailbox (Vault economy).
authors: [ISend]
softdepend: [Vault]
commands:
  isend:
    description: ISend main command
    usage: /<command> help
permissions:
  isend.use:
    description: Use /isend (send, inbox, toggle, block, exception)
    default: true
  isend.admin:
    description: Use /isend reload, see, config
    default: op
