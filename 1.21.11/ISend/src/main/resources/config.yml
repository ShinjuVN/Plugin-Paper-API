  toggle-off: "&cĐã tắt chế độ nhận đồ. Không ai có thể gửi đồ cho bạn nữa."
  exception-added: "&aĐã thêm &e<player> &avào danh sách ngoại lệ được phép gửi đồ."
  exception-removed: "&eĐã xóa &6<player> &ekhỏi danh sách ngoại lệ."
