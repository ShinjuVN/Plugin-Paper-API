  mail-notification: "<gray>[isend] <gold><sender> <yellow>vừa gửi đồ cho bạn!\n<click:run_command:'/isend gui'><green>[Mở hòm thư]</click>"
  join-notification: "<gray>[isend] <yellow>Bạn có <gold><count> <yellow>vật phẩm đang chờ trong hòm thư! <click:run_command:'/isend gui'><green>[Mở hòm thư]</click>"
  inbox-empty: "&cHòm thư của bạn đang trống!"
