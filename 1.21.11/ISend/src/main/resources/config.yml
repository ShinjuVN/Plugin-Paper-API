  too-many-items: "&cMỗi lần gửi tối đa &e<max> &cô vật phẩm!"
  economy-unavailable: "&cHệ thống kinh tế chưa sẵn sàng nên không thể thu phí chuyển phát!"
  inventory-full: "&eTúi đồ của bạn đã đầy! Một số vật phẩm vẫn còn trong hòm thư."
  error-generic: "&cĐã xảy ra lỗi khi lưu dữ liệu. Giao dịch đã bị hủy."
  config-header: "&6&lISend &7- cấu hình hiện tại"
  config-line: "&7<key>: &e<value>"
  help: |-
    &6&lISend &7- Danh sách lệnh
    &e/isend &7- Bật/tắt nhận đồ
