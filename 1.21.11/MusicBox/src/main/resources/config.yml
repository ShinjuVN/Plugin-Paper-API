# ============================================================
#  MusicBox - cấu hình
#  Hỗ trợ mã màu '&' (&a, &c, &l, ...).
#  Biến dùng được: {id} {player} {action} {source} {count} {max} ...
#  (mỗi thông báo hỗ trợ các biến tương ứng, xem mặc định bên dưới)
#  Dùng /musicbox reload để áp dụng thay đổi.
# ============================================================

prefix: "&8[&d♪ MusicBox&8] &r"

settings:
  # Chỉ cho phép link thuộc các tên miền này (gồm cả tên miền con).
  # [] = cho phép MỌI tên miền (catbox.moe, github.io, archive.org, ...).
  # Muốn giới hạn lại, ví dụ:
  #   allowed-domains:
  #     - "catbox.moe"
  allowed-domains: []
  # Kiểm tra link ngay khi /musicbox add (chỉ tốn vài KB dữ liệu). Link chắc chắn hỏng
  # (404, trang web, FLAC...) sẽ bị từ chối luôn thay vì lưu rồi mới lỗi khi phát.
  verify-on-add: true
  # Số lượt tải nhạc chạy cùng lúc (người thừa xếp hàng chờ). Cần khởi động lại server để đổi.
  max-concurrent-downloads: 3
  # Số bài tối đa mỗi người chơi (admin có musicbox.admin không bị giới hạn)
  max-songs-per-player: 20
  # Dung lượng file tối đa khi tải (MB)
  max-file-size-mb: 30
  # Thời lượng tối đa của 1 bài (giây). Bài dài hơn sẽ bị cắt.
  max-duration-seconds: 600
  # Số giây nhạc được đệm trước khi bắt đầu phát (phát khi đang tải, không cần chờ tải xong)
  prebuffer-seconds: 2.0
  # User-Agent khi tải file (giống trình duyệt để tránh bị một số host chặn)
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36 MusicBox/1.0"
  connect-timeout-ms: 8000
  read-timeout-ms: 15000
  # Chặn link trỏ tới IP nội bộ (localhost, 192.168.x.x...) để tránh SSRF.
  block-private-addresses: true

# Cache file nhạc gốc (mp3/ogg/wav) trong plugins/MusicBox/cache để nghe lại không tốn thêm dữ liệu mạng.
cache:
  enabled: true
  # Dung lượng tối đa của cache (MB). Đầy thì tự xóa file lâu chưa dùng nhất.
  max-size-mb: 200
  # Trong khoảng này (giờ) dùng thẳng bản cache, không hỏi lại host.
  # Hết hạn thì hỏi lại bằng ETag/Last-Modified: host trả 304 thì không phải tải lại file.
  # 0 = luôn hỏi lại host (vẫn tiết kiệm nếu host hỗ trợ 304).
  ttl-hours: 24

audio:
  # Khoảng cách (block) mà người xung quanh có thể nghe nhạc bạn phát
  distance: 24
  # Hệ số âm lượng (1.0 = giữ nguyên, 0.5 = nhỏ một nửa)
  volume: 1.0

gui:
  title: "&8Cài đặt MusicBox"
  filler: true
  none: "&7(chưa có)"
  state-on: "&aBẬT"
  state-off: "&cTẮT"
  modes:
    playlist: "&bLặp lại danh sách phát"
    single: "&bLặp lại bài đang phát"
    shuffle: "&bPhát ngẫu nhiên"
  items:
    listen:
      name: "&eNghe nhạc người khác: {state}"
      lore:
        - "&7Khi bật, bạn sẽ nghe được nhạc"
        - "&7do người chơi ở gần bạn phát."
        - ""
        - "&fClick để bật/tắt"
    repeat:
      name: "&eLặp lại bài cá nhân: {state}"
      lore:
        - "&7Khi bật, bài cá nhân sẽ tự phát tiếp"
        - "&7theo chế độ phát lại bên cạnh."
        - "&7Khi tắt, bài chỉ phát một lần."
        - ""
        - "&fClick để bật/tắt"
    mode:
      name: "&eChế độ phát lại: {mode}"
      lore:
        - "&7Bài phát gần nhất: &f{last}"
        - ""
        - "&7Các chế độ:"
        - "&8 - &7Lặp lại danh sách phát"
        - "&8 - &7Lặp lại bài đang phát"
        - "&8 - &7Phát ngẫu nhiên"
        - ""
        - "&fClick để chuyển chế độ"
    cancel:
      name: "&cHủy nhạc hiện tại"
      lore:
        - "&7Dừng ngay bài đang phát."

