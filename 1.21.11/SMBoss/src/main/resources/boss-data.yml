# SMBoss - du lieu boss
# nbt: base64 cua NBT mob | name: ten hien thi (ma mau &) | exp: exp roi ra (-1 = mac dinh)
# spawn-message: cac dong thong bao toan server ({boss} {player} {world} {x} {y} {z})
# drops: item (ten Material), amount (so hoac min-max), chance (% 0-100), name, lore, enchants
